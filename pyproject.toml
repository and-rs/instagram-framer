[project]
name = "framer-uploader"
version = "0.1.0"
description = "FastAPI + HTMX Instagram image framer/uploader"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "pillow",
    "openai",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
